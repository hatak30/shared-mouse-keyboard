# Builds signed installers for macOS (universal), Windows and Linux when a
# version tag (v1.2.3) is pushed, and publishes them as a GitHub Release
# together with latest.json, which the in-app updater reads.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (update signatures)
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#   APPLE_SIGNING_IDENTITY, APPLE_TEAM_ID                          (Developer ID signing)
# Optional (notarization):
#   APPLE_ID, APPLE_PASSWORD (app-specific password)
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Only enable notarization when its secrets exist; an empty APPLE_ID
      # would otherwise make the bundler try (and fail) to notarize.
      - name: Notarization credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ]; then
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
            echo "Notarization enabled"
          else
            echo "Notarization secrets not set; app will be signed but not notarized"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: app
          tauriScript: cargo tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Shared Mouse Keyboard ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your system below:
            - **macOS** (Apple Silicon and Intel): `.dmg`
            - **Windows**: `-setup.exe` (or `.msi`)
            - **Linux**: `.deb` (Debian/Ubuntu), `.rpm` (Fedora), or `.AppImage` (auto-updates)

            Installed apps update themselves: open the control panel and click **Install & restart** when a new version is announced.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
