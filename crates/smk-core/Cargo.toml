[package]
name = "smk-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core engine for Shared Mouse & Keyboard: networking, layout, input and clipboard"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
bincode = "1.3"
thiserror = "2"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
hostname = "0.4"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pki-types = "1"
clipboard-rs = "0.3"
socket2 = { version = "0.6", features = ["all"] }
fs4 = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["highsierra"] }
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_Security",
  "Win32_UI_Shell",
] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
x11rb = { version = "0.14", features = ["randr"] }
clipboard-rs = { version = "0.3", features = ["wayland"] }
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
