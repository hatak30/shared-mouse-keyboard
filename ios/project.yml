name: SharedMouseKeyboard
options:
  bundleIdPrefix: io.github.hatak
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SharedMouseKeyboard:
    type: application
    platform: iOS
    sources:
      - SharedMouseKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hatak.sharedmousekeyboard
        SWIFT_OBJC_BRIDGING_HEADER: smk.h
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/build
        OTHER_LDFLAGS: -lsmk_ios
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Shared Mouse Keyboard
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Finds and connects to your computers on the local network to share the mouse and keyboard.
    preBuildScripts:
      - name: Build Rust engine
        script: '"$SRCROOT/../scripts/build-ios-lib.sh"'
        basedOnDependencyAnalysis: false
